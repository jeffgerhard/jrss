[project]
name = "jrss"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arrow>=1.4.0",
    "bleach>=6.4.0",
    "favicon>=0.7.0",
    "feedparser>=6.0.14",
    "inflect>=7.6.0",
    "pillow>=13.0.0",
    "python-slugify>=9.1.3",
    "yattag>=1.16.1",
]

[project.scripts]
jrss = "jrss:main"
feedreader = "jrss.feedreader:main"
htmlbuild = "jrss.htmlbuild.htmlbuild:main"
duckduckgo = "duckduckgo.duckduckgo:main"


[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
